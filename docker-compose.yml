services:
  expediente-local:
    build:
      context: .
      dockerfile: Dockerfile
    image: expediente-local-qvac:local
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      QVAC_MODEL: LLAMA_3_2_1B_INST_Q4_0
      MAX_DOCUMENT_SIZE_BYTES: 10485760
    volumes:
      - ./.qvac:/app/.qvac
    restart: unless-stopped
